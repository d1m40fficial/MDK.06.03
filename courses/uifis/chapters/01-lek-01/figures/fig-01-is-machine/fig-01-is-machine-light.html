.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}

></span><span class="iso-caption">Одна и та же запись проходит приём, обработку и маршрутизацию. Три записи остаются в хранилище, две выдаются как готовая информация, после чего тяга обратной связи доворачивает маховик на шаг 2.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
