<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сборочный стол устава</title><style>
:root{--paper:#f7f3e8;--ink:#24303a;--muted:#65717c;--line:#c3bca9;--accent:#9a7300;--card:#fffdf7;--red:#b23a2f;--green:#2f7d54;--blue:#2f5d8a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:16px}
.plate{position:relative;border:1px solid var(--line);background:linear-gradient(150deg,#fffdf7,#f0ead9);border-radius:10px;padding:30px 14px 54px}
.head{display:flex;justify-content:space-between;gap:12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.stage{display:block;width:100%;height:auto;touch-action:pan-y;outline:none}
.stage:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.node{fill:#fffdf7;stroke:#b7ae99;stroke-width:1.3;transition:stroke .2s,fill .2s}
.node.on{stroke:#9a7300;stroke-width:2.4;fill:#fff8e6}
.box{fill:#fffdf7;stroke:#b7ae99;stroke-width:1.3}
.lbl{font-size:12px;fill:#24303a}
svg text{stroke:none;stroke-width:0;paint-order:fill}
.small{font-size:10px;fill:#65717c}
.tiny{font-size:9px;fill:#8a8272}
.mid{font-size:11px;font-weight:600;fill:#24303a}
.big{font-size:13px;font-weight:700;fill:#24303a}
.axis{stroke:#b9c1c6;stroke-width:1}
.grid{stroke:#e3dccb;stroke-width:.8}
.dim{opacity:.22}
.readout{position:absolute;right:14px;bottom:28px;font-size:11px;letter-spacing:.03em;background:var(--paper);border:1px solid #ddd4c2;border-radius:4px;padding:2px 6px;max-width:78%}
.hint{position:absolute;left:14px;bottom:8px;right:150px;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cap{margin:8px 0 0;font-size:12px;color:var(--muted)}
.keys{display:flex;flex-wrap:wrap;gap:4px 14px;list-style:none;margin:6px 0;padding:0;font-size:12px;color:var(--muted)}
.keys li::before{content:"◇";color:#a8823d;margin-right:5px}
@media (max-width:560px){.wrap{padding:8px}.plate{padding:26px 4px 58px}.readout{right:6px;font-size:10px}.hint{left:6px;right:6px;bottom:8px;font-size:9px}}
@media (prefers-reduced-motion:reduce){.node{transition:none}}
</style></head>
<body><div class="wrap"><figure class="fig"><div class="plate">
<div class="head"><span>Fig 03</span><span>Сборочный стол устава</span></div>
<svg class="stage" viewBox="0 0 760 420" role="slider" tabindex="0" aria-label="Сборочный стол устава" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0">
<rect x="6" y="6" width="748" height="408" rx="10" fill="#f8f3e6" stroke="#d8cfba"/>
<text class="small" x="380" y="56" text-anchor="middle">ЧЕТЫРЕ ВХОДА СОБИРАЮТСЯ В СЕМЬ РАЗДЕЛОВ</text>
<g id="in0" class="node"><rect class="" x="24" y="80" width="168" height="46" rx="7"/><text class="mid" x="108" y="100" text-anchor="middle">бизнес-обоснование</text><text class="small" x="108" y="116" text-anchor="middle">зачем и какая выгода</text></g>
<line x1="194" y1="103" x2="250" y2="103" stroke="#b7ae99" stroke-width="1.2"/>
<g id="in1" class="node"><rect class="" x="24" y="140" width="168" height="46" rx="7"/><text class="mid" x="108" y="160" text-anchor="middle">содержание</text><text class="small" x="108" y="176" text-anchor="middle">12 функций проекта</text></g>
<line x1="194" y1="163" x2="250" y2="163" stroke="#b7ae99" stroke-width="1.2"/>
<g id="in2" class="node"><rect class="" x="24" y="200" width="168" height="46" rx="7"/><text class="mid" x="108" y="220" text-anchor="middle">ограничения</text><text class="small" x="108" y="236" text-anchor="middle">срок, бюджет, люди</text></g>
<line x1="194" y1="223" x2="250" y2="223" stroke="#b7ae99" stroke-width="1.2"/>
<g id="in3" class="node"><rect class="" x="24" y="260" width="168" height="46" rx="7"/><text class="mid" x="108" y="280" text-anchor="middle">допущения</text><text class="small" x="108" y="296" text-anchor="middle">что считаем верным</text></g>
<line x1="194" y1="283" x2="250" y2="283" stroke="#b7ae99" stroke-width="1.2"/>
<rect class="node" x="252" y="68" width="280" height="282" rx="10"/>
<rect x="252" y="68" width="280" height="282" rx="10" fill="none" stroke="#9a7300" stroke-width="2"/>
<text class="big" x="392" y="98" text-anchor="middle">УСТАВ ПРОЕКТА</text>
<g id="s0"><rect x="268" y="116" width="248" height="26" rx="4" fill="#f1e8d2"/><text class="small" x="278" y="133" text-anchor="start">1. цель и выгода</text></g>
<g id="s1"><rect x="268" y="148" width="248" height="26" rx="4" fill="#f1e8d2"/><text class="small" x="278" y="165" text-anchor="start">2. границы</text></g>
<g id="s2"><rect x="268" y="180" width="248" height="26" rx="4" fill="#f1e8d2"/><text class="small" x="278" y="197" text-anchor="start">3. результаты и вехи</text></g>
<g id="s3"><rect x="268" y="212" width="248" height="26" rx="4" fill="#f1e8d2"/><text class="small" x="278" y="229" text-anchor="start">4. бюджет и ресурсы</text></g>
<g id="s4"><rect x="268" y="244" width="248" height="26" rx="4" fill="#f1e8d2"/><text class="small" x="278" y="261" text-anchor="start">5. роли и полномочия</text></g>
<g id="s5"><rect x="268" y="276" width="248" height="26" rx="4" fill="#f1e8d2"/><text class="small" x="278" y="293" text-anchor="start">6. риски и допущения</text></g>
<g id="s6"><rect x="268" y="308" width="248" height="26" rx="4" fill="#f1e8d2"/><text class="small" x="278" y="325" text-anchor="start">7. подпись спонсора</text></g>
<line x1="532" y1="210" x2="566" y2="210" stroke="#b7ae99" stroke-width="1.2"/>
<g id="stamp" class="dim"><circle cx="640" cy="210" r="52" fill="none" stroke="#b23a2f" stroke-width="3"/><text class="mid" x="640" y="204" text-anchor="middle">СПОНСОР</text><text class="small" x="640" y="222" text-anchor="middle">подписано</text></g>
</svg>
<div class="readout" data-readout>вход: бизнес-обоснование</div>
<div class="hint">Заполняйте разделы по одному: устав закрывается подписью.</div>
</div><figcaption class="cap"><ul class="keys"><li>четыре входа</li><li>семь разделов</li><li>подпись спонсора</li></ul>Бизнес-обоснование, содержание, ограничения и допущения проходят в документ. Пока не заполнен последний раздел и нет подписи, проект не получает права работать.</figcaption></figure></div>
<script>
const STEPS=["вход: бизнес-обоснование", "цель и выгода", "границы проекта", "результаты и вехи", "бюджет и ресурсы", "роли и полномочия", "риски и допущения", "подпись спонсора"];
const N=STEPS.length;
let step=0,timer=0;
const stage=document.querySelector('.stage');
const readout=document.querySelector('[data-readout]');
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function show(n){step=((n%N)+N)%N;readout.textContent=STEPS[step];stage.setAttribute('aria-valuenow',String(step));stage.setAttribute('aria-valuetext',STEPS[step]);apply(step);}
function start(){if(!timer&&!reduce)timer=setInterval(()=>show(step+1),3800);}
function stop(){clearInterval(timer);timer=0;}
stage.addEventListener('keydown',e=>{let n=null;if(e.key==='ArrowRight'||e.key==='ArrowUp')n=step+1;if(e.key==='ArrowLeft'||e.key==='ArrowDown')n=step-1;if(e.key==='Home')n=0;if(e.key==='End')n=N-1;if(n!==null){e.preventDefault();stop();show(n);}});
stage.addEventListener('pointermove',e=>{const b=stage.getBoundingClientRect();const share=Math.max(0,Math.min(1,(e.clientX-b.left)/b.width));stop();show(Math.min(N-1,Math.floor(share*N)));});
stage.addEventListener('pointerleave',start);
stage.addEventListener('focus',stop);
function fitLabels(){
  document.querySelectorAll('svg text').forEach(t=>{
    t.removeAttribute('textLength');
    const g=t.closest('g'); if(!g) return;
    const shape=g.querySelector('rect,circle,ellipse,path,polygon'); if(!shape) return;
    const tag=shape.tagName.toLowerCase();
    const sb=shape.getBBox(), tb=t.getBBox();
    if(!sb.width||!tb.width) return;
    const avail = tag==='circle'? shape.r.baseVal.value*1.4 : (tag==='ellipse'? shape.rx.baseVal.value*1.4 : sb.width-10);
    if(tb.width>avail && avail>14){t.setAttribute('textLength',avail.toFixed(1));t.setAttribute('lengthAdjust','spacingAndGlyphs');}
  });
}
window.addEventListener('resize',fitLabels);
fitLabels();
if(!reduce)start();
show(0);


function apply(n){
  for(let i=0;i<4;i++)document.getElementById('in'+i).classList.toggle('on', n<=3 && i===n);
  for(let i=0;i<7;i++){
    const el=document.getElementById('s'+i);
    const done = n>i;
    el.querySelector('rect').setAttribute('fill', done?'#f3e3b8':'#f1e8d2');
    el.classList.toggle('dim', !done && n<=i);
  }
  document.getElementById('stamp').classList.toggle('dim', n<7);
}
</script></body></html>
